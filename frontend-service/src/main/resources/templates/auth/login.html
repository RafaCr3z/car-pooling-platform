<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Car Pooling PT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #0369a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            max-width: 480px;
            width: 100%;
            padding: 36px;
        }

        .btn-quick {
            border: 1px dashed #cbd5e1;
            background: #f8fafc;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.83rem;
            text-align: left;
            transition: all 0.2s;
            cursor: pointer;
            width: 100%;
            margin-bottom: 6px;
        }

        .btn-quick:hover {
            background: #e0f2fe;
            border-color: #38bdf8;
            transform: translateX(4px);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-2" style="width: 56px; height: 56px;">
            <i class="fas fa-car-side fs-4"></i>
        </div>
        <h3 class="fw-bold text-dark mb-1">Car Pooling PT</h3>
        <p class="text-muted small">Entra na tua conta para partilhar despesas e viagens</p>
    </div>

    <!-- Mensagens Flash -->
    <div th:if="${error}" class="alert alert-danger py-2 small" role="alert">
        <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${error}"></span>
    </div>
    <div th:if="${success}" class="alert alert-success py-2 small" role="alert">
        <i class="fas fa-check-circle me-1"></i> <span th:text="${success}"></span>
    </div>

    <!-- Contas de Demonstração e Teste Rápido -->
    <div class="mb-3 p-3 bg-light rounded-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold small text-primary"><i class="fas fa-magic me-1"></i> Contas de Demonstração (1 Clique):</span>
        </div>
        <button type="button" class="btn-quick" onclick="preencher('joao.silva@carpooling.pt', 'password123')">
            <div class="fw-bold text-dark"><i class="fas fa-car text-primary me-1"></i> João Silva (Condutor)</div>
            <div class="text-muted small">joao.silva@carpooling.pt | Peugeot 208</div>
        </button>
        <button type="button" class="btn-quick" onclick="preencher('maria.santos@carpooling.pt', 'password123')">
            <div class="fw-bold text-dark"><i class="fas fa-user text-success me-1"></i> Maria Santos (Passageira)</div>
            <div class="text-muted small">maria.santos@carpooling.pt | Passageira Regular</div>
        </button>
        <button type="button" class="btn-quick" onclick="preencher('admin@carpooling.pt', 'admin123')">
            <div class="fw-bold text-dark"><i class="fas fa-shield-alt text-danger me-1"></i> Administrador</div>
            <div class="text-muted small">admin@carpooling.pt | Moderação & KPIs CO2</div>
        </button>
    </div>

    <form method="POST" action="/login">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Email</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="email" name="email" required placeholder="seu@email.com">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Palavra-passe</label>
            <div class="input-group">
                <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
            <i class="fas fa-sign-in-alt me-1"></i> Iniciar Sessão
        </button>
    </form>

    <div class="text-center mt-3 pt-2 border-top">
        <span class="small text-muted">Ainda não tens conta?</span>
        <a href="/register" class="small fw-bold text-primary text-decoration-none ms-1">Regista-te aqui</a>
        <div class="mt-2">
            <a href="/" class="small text-muted text-decoration-none"><i class="fas fa-arrow-left me-1"></i> Voltar à Página Inicial</a>
        </div>
    </div>
</div>

<script>
    function preencher(email, pwd) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = pwd;
    }
</script>

</body>
</html>
