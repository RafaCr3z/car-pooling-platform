name: CarPooling CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Automated Unit Tests (51 Tests)
        run: mvn -B test --file pom.xml

      - name: Build & Package Microservices with Maven
        run: mvn -B clean package -DskipTests --file pom.xml

      - name: Verify Docker Compose Config (18 Containers)
        run: docker compose config

      - name: Validate Kubernetes Manifests (Kustomize Build)
        run: kubectl kustomize k8s/

      - name: Run Trivy Vulnerability Scanner (DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
