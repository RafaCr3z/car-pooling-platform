spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: trip-service
          uri: lb://trip-service
          predicates:
            - Path=/api/trips/**

        - id: vehicle-service
          uri: lb://vehicle-service
          predicates:
            - Path=/api/vehicles/**

        - id: location-service
          uri: lb://location-service
          predicates:
            - Path=/api/locations/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: admin-service
          uri: lb://admin-service
          predicates:
            - Path=/api/admin/**

        # OpenAPI / Swagger aggregation routes
        - id: auth-service-docs
          uri: lb://auth-service
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs

        - id: trip-service-docs
          uri: lb://trip-service
          predicates:
            - Path=/v3/api-docs/trips
          filters:
            - RewritePath=/v3/api-docs/trips, /v3/api-docs

        - id: vehicle-service-docs
          uri: lb://vehicle-service
          predicates:
            - Path=/v3/api-docs/vehicles
          filters:
            - RewritePath=/v3/api-docs/vehicles, /v3/api-docs

        - id: payment-service-docs
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payments
          filters:
            - RewritePath=/v3/api-docs/payments, /v3/api-docs

        - id: location-service-docs
          uri: lb://location-service
          predicates:
            - Path=/v3/api-docs/locations
          filters:
            - RewritePath=/v3/api-docs/locations, /v3/api-docs

        - id: admin-service-docs
          uri: lb://admin-service
          predicates:
            - Path=/v3/api-docs/admin
          filters:
            - RewritePath=/v3/api-docs/admin, /v3/api-docs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Auth Service
        url: /v3/api-docs/auth
      - name: 2. Trip Service
        url: /v3/api-docs/trips
      - name: 3. Vehicle Service
        url: /v3/api-docs/vehicles
      - name: 4. Payment Service
        url: /v3/api-docs/payments
      - name: 5. Location Service
        url: /v3/api-docs/locations
      - name: 6. Admin Service
        url: /v3/api-docs/admin

server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
